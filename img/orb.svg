<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 150" role="img" aria-label="ORB — Sistema de Gestão Integrada">
  <defs>
    <linearGradient id="orb-esfera" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#8FDEFF"/>
      <stop offset="1" stop-color="#009FE3"/>
    </linearGradient>
    <linearGradient id="orb-orbita" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4FF"/>
      <stop offset=".55" stop-color="#2BBEFF"/>
      <stop offset="1" stop-color="#6FD2FF"/>
    </linearGradient>
    <!-- A órbita entra POR TRÁS do anel embaixo à esquerda e sai por
         cima no alto à direita. Esta janela é por onde o anel some —
         é o corte que dá volume à marca. -->
    <mask id="orb-corte">
      <rect width="660" height="150" fill="#fff"/>
      <path d="M30 96 L96 24 L110 36 L44 108 Z" fill="#000"/>
    </mask>
  </defs>

  <circle cx="74" cy="74" r="45" fill="none" stroke="currentColor"
          stroke-width="15" mask="url(#orb-corte)"/>
  <g transform="rotate(-40 74 74)">
    <path d="M15 74 a59 27 0 0 0 118 0" fill="none"
          stroke="url(#orb-orbita)" stroke-width="8.5" stroke-linecap="round"/>
  </g>
  <circle cx="118" cy="33" r="12" fill="url(#orb-esfera)"/>

  <text x="158" y="96" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="74" font-weight="800" letter-spacing="-.5"
        fill="currentColor">ORB</text>
  <text x="161" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="14.5" font-weight="500" letter-spacing="5"
        fill="currentColor" opacity=".8">SISTEMA DE GESTÃO INTEGRADA</text>
</svg>
